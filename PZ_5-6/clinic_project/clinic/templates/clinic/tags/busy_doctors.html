<h3 class="mb-4 fw-bold text-start">Самые занятые врачи</h3>

<div style="max-width: 500px;"> <!-- Ограничиваем общую ширину списка под размер вашей формы -->
    {% for doctor in doctors %}
        <div class="card mb-2 shadow-sm">
            <div class="card-body d-flex justify-content-between align-items-center py-2 px-3">
                <div class="text-start">
                    <a href="{% url 'clinic:doctor_detail' pk=doctor.pk %}" class="fw-bold text-decoration-none d-block">
                        {{ doctor.full_name }}
                    </a>
                    <span class="text-muted small">{{ doctor.specialty }}</span>
                </div>
                <div class="text-end">
                    <span class="badge bg-primary px-3 py-2 fs-6">{{ doctor.appointments_count }}</span>
                </div>
            </div>
        </div>
    {% empty %}
        <p class="text-muted text-start">Нет данных</p>
    {% endfor %}
</div>
